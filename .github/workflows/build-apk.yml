name: Build Mihrab Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Debug & Optional Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Debug Keystore & Optional Firebase Config
        shell: bash
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > app/google-services.json
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:compileDebugKotlin :app:assembleDebug --no-daemon
          else
            gradle :app:compileDebugKotlin :app:assembleDebug --no-daemon
          fi

      - name: Build Signed Release APK (if release signing secrets are set)
        if: ${{ secrets.RELEASE_KEYSTORE_B64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > my-upload-key.jks
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleRelease --no-daemon
          else
            gradle :app:assembleRelease --no-daemon
          fi

      - name: Collect APK Outputs
        shell: bash
        run: |
          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk dist-apk/Mihrab-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist-apk/Mihrab-release.apk
          fi
          ls -lh dist-apk/

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihrab-android-apk
          path: dist-apk/*.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mihrab-v1.0.${{ github.run_number }}
          name: Mihrab Android v1.0.${{ github.run_number }}
          body: |
            Automated native Android APK build for **Mihrab (محراب)**.
            - Application ID: `com.aistudio.mihrab.xkpqzr`
            - Target SDK: 36 (Min SDK: 24)
            - Super Admin Lock: `habiybullohy@gmail.com`
          files: dist-apk/*.apk
          draft: false
          prerelease: false
