name: Build Mihrab Android APK

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-android-apk:
    name: Build Debug & Optional Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK & Accept Licenses
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_DIR/licenses/android-sdk-preview-license"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            echo "Using sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "build-tools;36.0.0" "platforms;android-36.1" || \
              "$SDKMANAGER" "platform-tools" "build-tools;36.0.0" "platforms;android-36" || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Debug Keystore & Optional Firebase Config
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        shell: bash
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | tr -d '\r\n' | base64 -d > app/google-services.json
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Build Signed Release APK (if release signing secrets are set)
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$RELEASE_KEYSTORE_B64" | tr -d '\r\n' | base64 -d > my-upload-key.jks
            if [ -x ./gradlew ]; then
              ./gradlew :app:assembleRelease --no-daemon --stacktrace
            else
              gradle :app:assembleRelease --no-daemon --stacktrace
            fi
          else
            echo "Release keystore secrets not configured; skipping signed Release APK."
          fi

      - name: Collect APK Outputs
        shell: bash
        run: |
          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk dist-apk/Mihrab-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist-apk/Mihrab-release.apk
          fi
          ls -lh dist-apk/

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mihrab-android-apk
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with APK
        id: gh_release
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mihrab-v1.0.${{ github.run_number }}.${{ github.run_attempt }}
          name: Mihrab Android v1.0.${{ github.run_number }}
          body: |
            Automated native Android APK build for **Mihrab (محراب)**.
            - Application ID: `com.aistudio.mihrab.xkpqzr`
            - Target SDK: 36 (Min SDK: 24)
            - Super Admin Lock: `habiybullohy@gmail.com`
          files: dist-apk/*.apk
          draft: false
          prerelease: false

      - name: Write Download Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Mihrab Android APK Build"
            if [ -f dist-apk/Mihrab-debug.apk ]; then
              echo "- **Artifact**: Download \`mihrab-android-apk\` from the **Artifacts** section at the bottom of this workflow run."
            fi
            if [ "${{ steps.gh_release.outcome }}" = "success" ]; then
              echo "- **GitHub Release**: Published under the repository **Releases** tab."
            else
              echo "- **GitHub Release note**: If the Release step was skipped/blocked, enable **Settings -> Actions -> General -> Workflow permissions -> Read and write permissions** in GitHub, or download \`mihrab-android-apk\` directly from **Artifacts** above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
